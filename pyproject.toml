[project]
name = "business-applications-of-machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib==3.10.9",
    "missingno>=0.5.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "optuna==4.8.0",
    "pandas>=3.1.1",
    "phik==0.12.4",
    "psutil>=7.2.2",
    "pydantic>=2",
    "pytest>=9.2.0",
    "scikit-learn==1.7.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 88
target-version = "py312"   # Укажите вашу версию Python
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"] # Пример: игнорировать ошибки длины строки, если нужно

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]            # ← добавить блок целиком
module = ["yaml.*"]
ignore_missing_imports = true
