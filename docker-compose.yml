services:
  train:
    build: .
    image: car-price-ml:latest
    command: scripts.train
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    restart: "no"

  predict:
    image: car-price-ml:latest
    command: >
      scripts.predict
      --input /app/data/autos.csv
      --output /app/output/preds.csv
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./output:/app/output
    depends_on:
      train:
        condition: service_completed_successfully

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
